<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ANSEMS WL Admin</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #060203;
      --panel: #130707;
      --text: #fff7eb;
      --muted: #b6a392;
      --line: rgba(255, 226, 181, 0.16);
      --primary: #4FFEAB;
      --gold: #FFDA7E;
      --red: #835E40;
      --green: #4FFEAB;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(79, 254, 171, 0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(131, 94, 64, 0.18), transparent 34%),
        var(--bg);
    }

    main {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(2rem, 7vw, 4.5rem);
      line-height: 0.95;
      text-transform: uppercase;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 1.15rem;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .panel,
    .stat,
    table {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(19, 7, 7, 0.84);
      backdrop-filter: blur(16px);
    }

    .panel {
      padding: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--text);
      font-weight: 850;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.055);
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    button {
      min-height: 46px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      color: #120303;
      background: linear-gradient(90deg, var(--primary), #d9ffe9);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .row {
      display: grid;
      gap: 10px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      padding: 14px;
    }

    .stat strong {
      display: block;
      color: var(--primary);
      font-size: 1.6rem;
      line-height: 1;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .note {
      min-height: 0;
      margin: 0;
      color: var(--green);
    }

    .note.error {
      color: #ffb4b4;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      overflow: hidden;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid rgba(255, 226, 181, 0.1);
      text-align: left;
      vertical-align: top;
      font-size: 0.9rem;
    }

    th {
      color: var(--gold);
      background: rgba(255, 255, 255, 0.035);
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    td {
      color: #ead4c2;
    }

    .mono {
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.82rem;
    }

    @media (min-width: 760px) {
      main {
        padding: 44px 0;
      }

      .grid {
        grid-template-columns: minmax(0, 0.8fr) minmax(280px, 0.45fr);
      }

      .row {
        grid-template-columns: 1fr auto;
        align-items: end;
      }
    }

    @media (max-width: 560px) {
      main {
        width: min(100% - 24px, 1120px);
        padding: 24px 0;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>WL Admin</h1>
      <p>Review ANSEMS whitelist entries, draw winners, and save final WL results to Supabase.</p>
    </header>

    <div class="grid">
      <section class="panel">
        <h2>Admin Access</h2>
        <div class="row">
          <label>
            Admin key
            <input id="adminKey" type="password" autocomplete="off" placeholder="Enter admin key">
          </label>
          <button id="loadData" type="button">Load WL Data</button>
        </div>
      </section>

      <section class="panel">
        <h2>Raffle Draw</h2>
        <div class="row">
          <label>
            Winners to draw
            <input id="winnerCount" type="number" min="1" max="2999" value="50">
          </label>
          <button id="runRaffle" type="button">Run Raffle</button>
        </div>
      </section>
    </div>

    <section class="panel" style="margin-top: 14px;">
      <div class="stats">
        <div class="stat"><strong id="entryTotal">0</strong><span>Total entries</span></div>
        <div class="stat"><strong id="eligibleTotal">0</strong><span>Eligible left</span></div>
        <div class="stat"><strong id="winnerTotal">0</strong><span>Final winners</span></div>
      </div>
      <p class="note" id="adminNote" aria-live="polite"></p>
    </section>

    <section class="panel" style="margin-top: 14px;">
      <h2>Final WL Winners</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>X</th>
              <th>Wallet</th>
              <th>Comment</th>
              <th>Selected</th>
            </tr>
          </thead>
          <tbody id="winnerRows">
            <tr><td colspan="4">No winners loaded.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const adminKey = document.querySelector("#adminKey");
    const winnerCount = document.querySelector("#winnerCount");
    const loadData = document.querySelector("#loadData");
    const runRaffle = document.querySelector("#runRaffle");
    const adminNote = document.querySelector("#adminNote");
    const entryTotal = document.querySelector("#entryTotal");
    const eligibleTotal = document.querySelector("#eligibleTotal");
    const winnerTotal = document.querySelector("#winnerTotal");
    const winnerRows = document.querySelector("#winnerRows");

    function setNote(message, isError = false) {
      adminNote.textContent = message;
      adminNote.classList.toggle("error", isError);
    }

    function renderWinners(winners) {
      if (!winners.length) {
        winnerRows.innerHTML = '<tr><td colspan="4">No winners yet.</td></tr>';
        return;
      }

      winnerRows.innerHTML = winners.map((winner) => `
        <tr>
          <td>${winner.x_username}</td>
          <td class="mono">${winner.wallet_address}</td>
          <td><a href="${winner.comment_link}" target="_blank" rel="noreferrer">Open</a></td>
          <td>${new Date(winner.selected_at).toLocaleString()}</td>
        </tr>
      `).join("");
    }

    async function requestAdmin(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "x-admin-key": adminKey.value,
          ...(options.headers || {}),
        },
      });
      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "Admin request failed.");
      }

      return data;
    }

    async function refreshData() {
      const data = await requestAdmin("/api/admin/wl-entries");
      entryTotal.textContent = data.totals.entries;
      eligibleTotal.textContent = data.totals.eligible;
      winnerTotal.textContent = data.totals.winners;
      renderWinners(data.winners);
      setNote("WL data loaded.");
    }

    loadData.addEventListener("click", async () => {
      try {
        loadData.disabled = true;
        setNote("Loading WL data...");
        await refreshData();
      } catch (error) {
        setNote(error.message, true);
      } finally {
        loadData.disabled = false;
      }
    });

    runRaffle.addEventListener("click", async () => {
      try {
        runRaffle.disabled = true;
        setNote("Running raffle...");
        const result = await requestAdmin("/api/admin/wl-raffle", {
          method: "POST",
          body: JSON.stringify({ winnerCount: winnerCount.value }),
        });
        setNote(`Raffle complete. ${result.totals.selected} winner(s) saved.`);
        await refreshData();
      } catch (error) {
        setNote(error.message, true);
      } finally {
        runRaffle.disabled = false;
      }
    });
  </script>
</body>
</html>
